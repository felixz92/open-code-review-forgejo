name: CI

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.out

      - name: Build
        run: go build -o bin/ocr-forgejo ./cmd/ocr-forgejo

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go build -trimpath -ldflags="-s -w" -o "bin/ocr-forgejo-${{ runner.os }}-amd64" ./cmd/ocr-forgejo
          gh release create "${GITHUB_REF_NAME}" "bin/ocr-forgejo-${{ runner.os }}-amd64" \
            --title "${GITHUB_REF_NAME}" --generate-notes
