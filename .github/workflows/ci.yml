name: CI

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.out

      - name: Build
        run: go build -o bin/ocr-forgejo ./cmd/ocr-forgejo

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "bin/ocr-forgejo-$os-$arch" ./cmd/ocr-forgejo
          done
          gh release create "${GITHUB_REF_NAME}" \
            "bin/ocr-forgejo-linux-amd64" \
            "bin/ocr-forgejo-linux-arm64" \
            "bin/ocr-forgejo-darwin-arm64" \
            --title "${GITHUB_REF_NAME}" --generate-notes
